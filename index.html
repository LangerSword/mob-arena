<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOB Arena</title>
<style>
  :root {
    --bg: #0b0b0d; --panel: #141417; --line: #26262c; --ink: #e8e6e1; --dim: #8f8b85;
    --accent: #c8a24a; --magic: #7aa2ff; --hunter: #63d6a4; --brute: #ff8a6b;
    --win: #63d6a4; --lose: #ff8a6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  header { border-bottom: 1px solid var(--line); padding: 20px 24px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; margin: 0; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr) minmax(300px, 1.2fr); gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
  .panel h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  select, input, button { font: inherit; color: var(--ink); background: #0f0f12; border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; width: 100%; }
  button { cursor: pointer; background: var(--accent); color: #141414; border: none; font-weight: 600; letter-spacing: .04em; padding: 9px 12px; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; letter-spacing: .04em; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
  .vs .mark { color: var(--accent); font-size: 20px; text-align: center; font-weight: 600; }
  .card { background: #0f0f12; border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
  .card .art { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; background: #000; display: block; }
  .card h3 { font-size: 15px; margin: 10px 0 2px; }
  .card .meta { color: var(--dim); font-size: 12px; }
  .bar { height: 6px; background: #1e1e22; border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 2px; letter-spacing: .06em; text-transform: uppercase; }
  .tag.Magic { color: var(--magic); border: 1px solid currentColor; }
  .tag.Hunter { color: var(--hunter); border: 1px solid currentColor; }
  .tag.Brute { color: var(--brute); border: 1px solid currentColor; }
  #log { max-height: 340px; overflow: auto; font: 12px/1.6 ui-monospace, monospace; }
  #log div { border-bottom: 1px solid #1e1e22; padding: 3px 0; display: flex; justify-content: space-between; }
  #log .r { color: var(--dim); } #log .h { color: var(--accent); }
  .result { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin-top: 12px; }
  .result.win { color: var(--win); } .result.lose { color: var(--lose); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row > * { flex: 1; }
  .err { color: var(--lose); font-size: 13px; margin-top: 8px; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>MOB Arena</h1>
  <span class="sub">Fight live Beasts from Starknet. Art, stats and sound come from the chain.</span>
  <span class="sub" id="status">reading chain…</span>
</header>
<main>
  <section class="panel">
    <h2>Challenger</h2>
    <label for="aSpecies">Species</label>
    <select id="aSpecies"></select>
    <label for="aToken">Beast</label>
    <select id="aToken"></select>
    <div class="card" id="aCard"></div>
  </section>
  <section class="panel">
    <h2>Opponent</h2>
    <label for="bSpecies">Species</label>
    <select id="bSpecies"></select>
    <label for="bToken">Beast</label>
    <select id="bToken"></select>
    <div class="card" id="bCard"></div>
  </section>
  <section class="panel">
    <h2>Fight</h2>
    <div class="row">
      <button id="fight">Fight</button>
      <button id="auto" class="ghost">Run 100</button>
    </div>
    <div class="result" id="result"></div>
    <div class="err" id="err"></div>
    <h2 style="margin-top:18px">Round log</h2>
    <div id="log"></div>
    <p class="hint">Higher level strikes first. Type advantage ×1.5, disadvantage ×0.75. Damage is 2% of power. Stats are read from the token ID, no RPC guesswork.</p>
  </section>
</main>
<script type="module">
import { config, decodeTokenId, tokenFacts, tokenUri, speciesTokens, listSpecies, affixName } from './src/chain.mjs';
import { battle, fighterFromBeast, power } from './src/engine.mjs';

const RPC = new URLSearchParams(location.search).get('rpc') ?? config('sepolia').rpc;
const status = document.getElementById('status');
status.textContent = `sepolia · ${new URL(RPC).host}`;

const $ = (id) => document.getElementById(id);
const els = { aSpecies: $('aSpecies'), aToken: $('aToken'), bSpecies: $('bSpecies'), bToken: $('bToken'), aCard: $('aCard'), bCard: $('bCard'), log: $('log'), result: $('result'), err: $('err') };

const TYPE = ['Magic', 'Hunter', 'Brute'];

// Onchain metadata is untrusted: only image data URIs are allowed through.
function safeImage(uri) {
  if (!uri || typeof uri !== 'string') return null;
  const m = /^data:image\/(png|gif|svg\+xml|webp);base64,[A-Za-z0-9+/=]+$/.exec(uri);
  return m ? uri : null;
}

function cardHtml(beast, meta) {
  const name = meta?.name ?? (affixName(beast) ? `"${affixName(beast)}" Beast ${beast.speciesId}` : `Beast ${beast.speciesId}`);
  const src = safeImage(meta?.image);
  const img = src ? `<img class="art" src="${src}" alt="">` : '<div class="art"></div>';
  const pct = Math.max(0, Math.round(beast.health / beast.maxHealth * 100));
  return `${img}<h3>${name}</h3>
    <div class="meta"><span class="tag ${TYPE[beast.beastType]}">${TYPE[beast.beastType]}</span> · tier ${beast.tier} · level ${beast.level} · power ${beast.power}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta">${beast.health} / ${beast.maxHealth} health · grade ${beast.grade ?? '—'} · rank ${beast.rank ?? '—'}</div>`;
}

async function fillTokens(select, speciesId) {
  select.innerHTML = '';
  try {
    const ids = await speciesTokens(RPC, 'sepolia', speciesId);
    for (const id of ids.slice(0, 40)) {
      const b = decodeTokenId(id);
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = `#${b.prefix}/${b.suffix} · L${b.level} · ${b.health}hp · ${TYPE[b.beastType]}`;
      select.appendChild(opt);
    }
    return ids;
  } catch (e) {
    select.innerHTML = '<option value="">chain read failed</option>';
    return [];
  }
}

async function showBeast(which, tokenId) {
  if (!tokenId) return;
  const beast = decodeTokenId(tokenId);
  try {
    const [facts, meta] = await Promise.all([tokenFacts(RPC, 'sepolia', tokenId), tokenUri(RPC, 'sepolia', tokenId)]);
    Object.assign(beast, facts);
    beast.tokenId = tokenId;
    beast.maxHealth = beast.health;
    els[which + 'Card'].innerHTML = cardHtml(beast, meta);
    return beast;
  } catch (e) {
    beast.tokenId = tokenId;
    beast.maxHealth = beast.health;
    beast.rank = 0; beast.grade = 0;
    els[which + 'Card'].innerHTML = cardHtml(beast, null) + `<div class="err">${e.message.slice(0, 120)}</div>`;
    return beast;
  }
}

async function refresh() {
  let species = [];
  try {
    species = await listSpecies(RPC, 'sepolia', 12);
  } catch (e) {
    els.err.textContent = `species list failed: ${e.message.slice(0, 100)}`;
  }
  if (!species.length) {
    species = [1, 2, 3, 4, 5, 6, 7].map((id) => ({ id, name: `Beast ${id}` }));
  }
  for (const s of species) {
    const a = document.createElement('option');
    a.value = s.id;
    a.textContent = `${s.id} · ${s.name}`;
    const b = a.cloneNode(true);
    els.aSpecies.appendChild(a);
    els.bSpecies.appendChild(b);
  }
  els.bSpecies.selectedIndex = Math.min(3, els.bSpecies.options.length - 1);
  await Promise.all([
    fillTokens(els.aToken, els.aSpecies.value), fillTokens(els.bToken, els.bSpecies.value),
  ]);
  await showBeast('a', els.aToken.value);
  await showBeast('b', els.bToken.value);
}

els.aSpecies.onchange = async () => { await fillTokens(els.aToken, els.aSpecies.value); await showBeast('a', els.aToken.value); };
els.bSpecies.onchange = async () => { await fillTokens(els.bToken, els.bSpecies.value); await showBeast('b', els.bToken.value); };
els.aToken.onchange = () => showBeast('a', els.aToken.value);
els.bToken.onchange = () => showBeast('b', els.bToken.value);

let fighting = false;
async function fight() {
  if (fighting) return;
  fighting = true;
  els.err.textContent = ''; els.result.textContent = ''; els.log.innerHTML = '';
  const aId = els.aToken.value, bId = els.bToken.value;
  if (!aId || !bId || aId === bId) { els.err.textContent = 'pick two different Beasts'; fighting = false; return; }
  let a, b;
  try {
    [a, b] = await Promise.all([showBeast('a', aId), showBeast('b', bId)]);
  } catch (e) { els.err.textContent = e.message; fighting = false; return; }
  const fa = fighterFromBeast(a), fb = fighterFromBeast(b);
  const out = battle(fa, fb, power);
  for (const r of out.log) {
    const div = document.createElement('div');
    div.innerHTML = `<span class="r">r${r.round} · ${r.first === 'a' ? 'A' : 'B'} first</span><span class="h">A ${r.a} · B ${r.b}</span>`;
    els.log.appendChild(div);
  }
  const res = out.winner === 'a' ? 'Challenger wins' : out.winner === 'b' ? 'Opponent wins' : 'Draw';
  els.result.textContent = res;
  els.result.className = 'result ' + (out.winner === 'a' ? 'win' : out.winner === 'b' ? 'lose' : '');
  fighting = false;
}

$('fight').onclick = fight;
$('auto').onclick = async () => {
  if (fighting) return;
  fighting = true;
  let wins = 0, losses = 0, draws = 0;
  const aIds = [...els.aToken.options].map((o) => o.value).slice(0, 10);
  const bIds = [...els.bToken.options].map((o) => o.value).slice(0, 10);
  for (const aId of aIds) {
    for (const bId of bIds) {
      if (aId === bId) continue;
      const a = fighterFromBeast(decodeTokenId(aId)), b = fighterFromBeast(decodeTokenId(bId));
      const out = battle(a, b, power);
      if (out.winner === 'a') wins++; else if (out.winner === 'b') losses++; else draws++;
    }
  }
  els.result.textContent = `${wins}W · ${losses}L · ${draws}D`;
  els.result.className = 'result';
  fighting = false;
};

refresh().catch((e) => { els.err.textContent = e.message; status.textContent = 'failed to read chain'; });
</script>
</body>
</html>
