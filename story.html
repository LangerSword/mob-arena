<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOB Arena — Story</title>
<style>
  :root {
    --bg:#0b0b0d; --panel:#141417; --line:#26262c; --ink:#e8e6e1; --dim:#8f8b85;
    --accent:#c8a24a; --win:#63d6a4; --lose:#ff8a6b; --magic:#7aa2ff; --hunter:#63d6a4; --brute:#ff8a6b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif,system-ui,sans-serif; }
  header { border-bottom:1px solid var(--line); padding:18px 24px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:15px; letter-spacing:.18em; text-transform:uppercase; margin:0; font-weight:600; }
  .sub { color:var(--dim); font-size:13px; }
  .link { margin-left:auto; font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
  main { max-width:1100px; margin:0 auto; padding:22px 24px; display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:20px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; }
  .panel h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 0 12px; font-weight:600; }
  .beast { background:#0f0f12; border:1px solid var(--line); border-radius:4px; padding:12px; }
  .beast h3 { margin:0 0 4px; font-size:17px; }
  .beast .meta { color:var(--dim); font-size:12px; }
  .bar { height:6px; background:#1e1e22; border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .xpbar { height:4px; background:#1e1e22; border-radius:2px; overflow:hidden; margin-top:8px; }
  .xpbar > i { display:block; height:100%; background:var(--magic); }
  .stats { display:flex; gap:14px; margin-top:12px; font-size:12px; color:var(--dim); flex-wrap:wrap; }
  .stats b { color:var(--ink); font-weight:600; }
  button { font:inherit; cursor:pointer; background:var(--accent); color:#141414; border:none; border-radius:3px; padding:10px 14px; font-weight:600; letter-spacing:.03em; }
  button:disabled { opacity:.35; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500; }
  .route { display:flex; flex-direction:column; gap:10px; }
  .node { display:grid; grid-template-columns:28px 1fr auto; gap:12px; align-items:center; background:#0f0f12; border:1px solid var(--line); border-radius:4px; padding:12px; }
  .node.locked { opacity:.45; }
  .node.cleared { border-color:#2d4a3a; }
  .node.open { border-color:var(--accent); }
  .node .dot { width:12px; height:12px; border-radius:50%; border:2px solid var(--dim); }
  .node.cleared .dot { background:var(--win); border-color:var(--win); }
  .node.open .dot { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px rgba(200,162,74,.15); }
  .node h4 { margin:0; font-size:14px; }
  .node .where { color:var(--dim); font-size:12px; }
  .node .go { min-width:76px; }
  .node.boss { background:linear-gradient(180deg,#1a1214,#0f0f12); }
  .bossmark { color:var(--lose); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  #log { max-height:260px; overflow:auto; font:12px/1.6 ui-monospace,monospace; margin-top:12px; }
  #log div { border-bottom:1px solid #1e1e22; padding:2px 0; display:flex; justify-content:space-between; }
  #log .h { color:var(--accent); }
  .result { margin-top:12px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; }
  .result.win { color:var(--win); } .result.lose { color:var(--lose); }
  .modal { position:fixed; inset:0; background:rgba(6,6,8,.82); display:none; align-items:center; justify-content:center; padding:20px; }
  .modal.on { display:flex; }
  .modal .box { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:22px; max-width:520px; width:100%; }
  .modal h3 { margin:0 0 4px; }
  .modal p { color:var(--dim); font-size:14px; margin:0 0 14px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row > * { flex:1; }
  .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:2px; letter-spacing:.06em; text-transform:uppercase; }
  .tag.Magic { color:var(--magic); border:1px solid currentColor; }
  .tag.Hunter { color:var(--hunter); border:1px solid currentColor; }
  .tag.Brute { color:var(--brute); border:1px solid currentColor; }
  .reset { font-size:12px; color:var(--dim); background:none; border:none; padding:0; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>MOB Arena — Story</h1>
  <span class="sub">Three regions. Nine encounters. One Beast that levels with you.</span>
  <span class="link"><a href="index.html">Arena mode →</a></span>
</header>
<main>
  <section class="panel">
    <h2>Your Beast</h2>
    <div class="beast" id="beast"></div>
    <div class="stats" id="stats"></div>
    <button class="reset" id="reset" style="margin-top:14px">reset save</button>
  </section>
  <section class="panel">
    <h2>Route</h2>
    <div class="route" id="route"></div>
    <div id="log"></div>
    <div class="result" id="result"></div>
  </section>
</main>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script type="module">
import { battle, power } from './src/engine.mjs';
import { REGIONS, createState, starterBeast, xpFor, levelFromXp, applyXp, unlocked } from './src/story.mjs';

const SAVE = 'mob-arena-save-v1';
const $ = (id) => document.getElementById(id);
const TYPE = ['Magic', 'Hunter', 'Brute'];

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE));
    if (raw && raw.beast) return raw;
  } catch { /* corrupted save */ }
  return createState();
}
function save(state) { localStorage.setItem(SAVE, JSON.stringify(state)); }

let state = load();

function renderBeast() {
  const b = state.beast;
  const lvl = levelFromXp(b.xp);
  $('beast').innerHTML = `<h3>${b.name}</h3>
    <div class="meta"><span class="tag ${TYPE[b.beastType]}">${TYPE[b.beastType]}</span> · tier ${b.tier} · level ${b.level} · power ${b.power}</div>
    <div class="bar"><i style="width:${Math.round(b.health / b.maxHealth * 100)}%"></i></div>
    <div class="meta">${b.health} / ${b.maxHealth} health</div>
    <div class="xpbar"><i style="width:${Math.round(lvl.into / lvl.need * 100)}%"></i></div>
    <div class="meta">level ${lvl.level} · ${lvl.into} / ${lvl.need} xp</div>`;
  $('stats').innerHTML = `<span>wins <b>${state.wins}</b></span><span>losses <b>${state.losses}</b></span><span>cleared <b>${state.completed.length}</b> / 9</span>`;
}

function renderRoute() {
  const list = unlocked(state);
  $('route').innerHTML = '';
  for (const e of list) {
    const node = document.createElement('div');
    node.className = `node ${e.state}${e.boss ? ' boss' : ''}`;
    node.innerHTML = `<span class="dot"></span>
      <div><h4>${e.name}</h4><div class="where">${e.regionName} · L${e.level} · ${e.health}hp ${e.boss ? '· <span class="bossmark">boss</span>' : ''}</div></div>`;
    const btn = document.createElement('button');
    btn.className = 'go';
    btn.textContent = e.state === 'cleared' ? 'Replay' : e.state === 'open' ? 'Fight' : 'Locked';
    btn.disabled = e.state === 'locked';
    btn.onclick = () => fight(e);
    node.appendChild(btn);
    $('route').appendChild(node);
  }
}

function logLine(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  $('log').prepend(div);
}

function modal(html) {
  $('modalBox').innerHTML = html;
  $('modal').classList.add('on');
}

function fight(enc) {
  const b = state.beast;
  const foe = {
    name: enc.name, speciesId: enc.species, level: enc.level, health: enc.health, maxHealth: enc.health,
    tier: enc.tier, beastType: enc.beastType, prefix: enc.prefix, suffix: enc.suffix, power: power(enc),
  };
  const out = battle({ ...b }, foe, power);
  const won = out.winner === 'a';
  const xp = xpFor(enc, won);
  const before = b.xp;
  const after = applyXp(b, xp);
  state.beast = after;
  if (won) {
    state.wins++;
    if (!state.completed.includes(enc.id)) state.completed.push(enc.id);
  } else {
    state.losses++;
  }
  save(state);

  for (const r of out.log.slice().reverse()) {
    logLine(`<span>r${r.round}</span><span class="h">you ${r.a} · foe ${r.b}</span>`);
  }
  const res = $('result');
  res.textContent = won ? `Won · +${xp} xp${after.levelUps ? ` · level ${after.level}!` : ''}` : `Lost · +${xp} xp`;
  res.className = 'result ' + (won ? 'win' : 'lose');

  modal(`<h3>${won ? 'Victory' : 'Defeat'}</h3>
    <p>${won ? `${enc.name} yields ${xp} xp.` : `${enc.name} was too strong. You keep ${xp} xp.`}${after.levelUps ? ` Your Beast reached level ${after.level}.` : ''}</p>
    <div class="row"><button id="again">Fight again</button><button class="ghost" id="close">Route</button></div>`);
  $('again').onclick = () => { $('modal').classList.remove('on'); fight(enc); };
  $('close').onclick = () => { $('modal').classList.remove('on'); renderBeast(); renderRoute(); };
  renderBeast(); renderRoute();
}

$('reset').onclick = () => {
  localStorage.removeItem(SAVE);
  state = createState();
  save(state);
  renderBeast(); renderRoute();
};

renderBeast();
renderRoute();
</script>
</body>
</html>
